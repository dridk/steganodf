[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "steganodf"
version = "0.3.1"
description = "Steganography and watermarking for tabular data: hide a secret message inside a CSV or Parquet dataframe"
readme = "README.md"
requires-python = ">=3.11"

license = "MIT"
keywords = [
  "steganography",
  "watermarking",
  "dataframe",
  "csv",
  "parquet",
  "polars",
  "pandas",
  "tabular-data",
  "data-provenance",
  "fingerprinting",
  "dataset-watermarking",
  "data-leak",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Security :: Cryptography",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
  "Typing :: Typed",
]

dependencies = [
  "polars",
  "reedsolo",
  "numpy"
]
authors = [
  {name="Sacha Schutz", email="sacha.schutz@pm.me"}
]

[project.urls]
Homepage = "https://github.com/dridk/steganodf"
Repository = "https://github.com/dridk/steganodf"
"Web app" = "https://dridk.github.io/steganodf/"
Issues = "https://github.com/dridk/steganodf/issues"
Changelog = "https://github.com/dridk/steganodf/releases"

[project.scripts]
steganodf = "steganodf.__main__:main"

[project.optional-dependencies]
dev= ["pytest", "twine", "build", "pandas", "pyarrow"]

[tool.hatch.build.targets.sdist]
include = ["steganodf", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
# examples/*.csv est couvert par le *.csv du .gitignore : il faut le réinclure explicitement.
artifacts = ["examples/*.csv"]

[tool.hatch.build.targets.wheel]
packages = ["steganodf"]
