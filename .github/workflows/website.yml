name: Deploy steganodf web page

on:
  push:
    branches:
      - main
permissions:
  contents: write
    
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install python deps
        run: python -m pip install build

      # Builds the wheel, fetches polars and reedsolo, and regenerates
      # pyscript.json so it points at the wheel we are about to deploy.
      - name: Build the site payload
        run: ./build_site.sh

      - name: Check files
        run: |
          ls www/
          cat www/pyscript.json

      - name: Deploy page
        uses: JamesIves/github-pages-deploy-action@v4 
        with:
          folder: www
          token: ${{ secrets.GITHUB_TOKEN }} 
